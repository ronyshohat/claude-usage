name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the ClaudeUsageCore tests with the Command Line Tools: no Xcode, no
  # project generation. Fast, and it covers the parsing rules that are easy to
  # break. Same command locally — see Tests/CoreTests.
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test ClaudeUsageCore
        run: swift test

      # The tests exercise the library directly, so nothing above would notice
      # the harness itself breaking — and it is what the README tells people to
      # run by hand. Check it parses a fixture and still rejects output it
      # cannot make sense of, rather than reporting a confident pair of zeroes.
      - name: Smoke-test the verify harness
        run: |
          set -euo pipefail
          ./Tools/verify.sh --parse Tools/fixtures/usage-output.txt \
            --now 2026-08-28T20:00:00Z

          echo "some unrelated text" > "$RUNNER_TEMP/junk.txt"
          if ./Tools/verify.sh --parse "$RUNNER_TEMP/junk.txt"; then
            echo "::error::parser accepted garbage"; exit 1
          fi
          echo "correctly rejected"

  app:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Ad-hoc signed ("-"), because CI has no certificate. The App Group
      # entitlement will not be granted, which is fine: SharedStore falls back
      # to the widget's own sandbox container.
      - name: Build
        run: |
          set -o pipefail
          version="1.0.${{ github.run_number }}"
          xcodebuild \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -project ClaudeUsage.xcodeproj \
            -scheme ClaudeUsage \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Check the bundle
        run: |
          set -euo pipefail
          app=build/Build/Products/Release/ClaudeUsage.app
          ext="$app/Contents/PlugIns/ClaudeUsageWidget.appex"

          # Embedding is the step most likely to break silently, and a widget
          # that is not embedded simply never appears in the gallery.
          test -d "$ext" || { echo "::error::widget extension was not embedded"; exit 1; }

          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" \
            "$ext/Contents/Info.plist" | grep -qx "com.apple.widgetkit-extension" \
            || { echo "::error::wrong extension point identifier"; exit 1; }

          stamped=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          expected="1.0.${{ github.run_number }}"
          test "$stamped" = "$expected" \
            || { echo "::error::version is $stamped, expected $expected"; exit 1; }
          echo "version $stamped"

          test -f "$app/Contents/Resources/AppIcon.icns" \
            || { echo "::error::app icon missing from the bundle"; exit 1; }

          echo "--- widget entitlements ---"
          codesign -d --entitlements - --xml "$ext" 2>/dev/null | plutil -p - || true

          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/ClaudeUsage.app ClaudeUsage.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage
          path: ClaudeUsage.zip
          if-no-files-found: error

      # Every push to main publishes a downloadable build. Pull requests only
      # get the artifact above.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" ClaudeUsage.zip \
            --title "$tag" \
            --notes-file .github/release-notes.md \
            --latest
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
